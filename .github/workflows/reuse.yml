name: REUSE Compliance

on:
  push:
  pull_request:

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install reuse
      - run: reuse lint
